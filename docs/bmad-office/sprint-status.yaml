    order: 5
    depends_on: ["2.1"]
    note: "story-2.2.md còn là khung rỗng."
  "2.3":
    epic: "2"
    title: "Story 2.3"
    status: backlog
    sprint: 2
    order: 6
    depends_on: ["2.2"]
    note: "story-2.3.md còn là khung rỗng."

# Rủi ro / việc cần xử lý trước khi Dev bắt đầu sprint 1
blockers:
  - "epics.md, prd.md, architecture.md chưa có nội dung -> PM/Architect cần hoàn thiện trước; Scrum Master không tự bịa yêu cầu."
  - "Story 1.1 đã Done (QA đạt, qa-1.1.md). Máy mặc định dùng Node 10, cần chuyển sang Node >= 20.19 (ví dụ v22.13.0 trong nvm). 5 story còn lại vẫn là khung; Scrum Master sẽ soạn tiếp 1.2 -> 1.3 khi epics.md có nội dung."
  - "Story 1.1: commit 6683830 thiếu các tệp cấu hình/types/data (đang untracked) -> cần commit đủ để repo build được từ HEAD (qa-1.1.md, V1)."
  - "qa-1.2 ... qa-2.3 vẫn là báo cáo 'mô phỏng', chưa có test thật; chỉ qa-1.1.md là kiểm thử thật."
