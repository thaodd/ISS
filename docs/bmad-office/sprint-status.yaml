    depends_on: ["2.2"]
    note: "Thêm trạng thái cài đặt (ví dụ đã cài / đang cài / lỗi / đã gỡ) và cập nhật phiên bản; chỉ ghi nhận thủ công, không cài thật. Có thể thêm lọc máy chủ theo ứng dụng nếu vừa phạm vi. Tên trạng thái là giả định của SM, cần PM xác nhận. story-2.3.md còn là khung; cần Create Story trước khi chuyển sang ready. Chỉ làm khi 2.2 qua QA vì dùng chung mô hình Installation."

