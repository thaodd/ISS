    status: review
    sprint: 2
    order: 5
    depends_on: ["2.1", "1.3"]
    note: "Commit feat(story-2.2) (Dev xong), CHƯA có commit 'QA PASS' nên chờ QA; working tree có test bổ sung chưa commit (App.installations.test.tsx, ServerDetail.test.tsx, ApplicationDetail.test.tsx). Người dùng đã chốt: xóa máy chủ/ứng dụng = cảnh báo + xóa kèm bản ghi cài đặt; ghi nhận từ chi tiết máy chủ; phiên bản bắt buộc, ngày cài tùy chọn (YYYY-MM-DD, không ở tương lai); thêm + xem + xóa, mỗi cặp máy chủ-ứng dụng chỉ 1 bản ghi. Installation (id ins-NNN, serverId, appId, version, installedAt?) khóa iss.installs.v1, seed rỗng. Giả định cần PM xác nhận: tên kiểu/trường, id ins-NNN, bản ghi mồ côi hiển thị '<appId> (không tìm thấy)'."
  "2.3":
