    order: 4
    depends_on: []
    note: "Commit feat(story-2.1) + test(story-2.1): QA PASS (229 test). Độc lập dữ liệu máy chủ, chỉ dùng khung và mẫu repository của 1.1-1.3. Là nền cho 2.2. Giả định cần PM xác nhận: trường ứng dụng (id, name, vendor bắt buộc; description tùy chọn), khóa iss.apps.v1, id app-NNN (max+1), tên không trùng (không phân biệt hoa/thường)."
