    status: done
    sprint: 1
    order: 3
    depends_on: ["1.2"]
    note: "Commit feat(story-1.3) + test(story-1.3): QA PASS. Cung cấp repository máy chủ (khóa iss.servers.v1) và thao tác xóa mà 2.2 phải xử lý kèm bản ghi cài đặt. Giả định cần PM xác nhận: id srv-NNN (max+1, có thể dùng lại id đã xóa), không bắt buộc hostname/IP duy nhất, không hoàn tác khi xóa."
  "2.1":
