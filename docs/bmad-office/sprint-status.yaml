    note: "Ngoài phạm vi sprint 1. Xếp sau Epic 1 vì ứng dụng cài đặt gắn với máy chủ (giả định)."

# order: thứ tự thực hiện toàn cục (1 = làm đầu tiên).
stories:
  "1.1":
    epic: "1"
    title: "Khung dự án React và mô hình dữ liệu máy chủ"
    status: done
    sprint: 1
    order: 1
    depends_on: []
    note: "QA đạt 2026-11-15 (qa-1.1.md): AC1-AC8 đạt, lint/build/test (37 test) chạy lại đều đạt. Cần Node >= 20.19 (máy mặc định là Node 10). Còn việc nhỏ: commit đủ tệp cấu hình/types/data chưa được track (V1), thêm engines Node. Tập trường Server, Vite/TS/Vitest vẫn là giả định của SM, cần PM/Architect xác nhận."
  "1.2":
    epic: "1"
    title: "Danh sách, tìm kiếm/lọc và xem chi tiết máy chủ"
    status: review
    sprint: 1
    order: 2
    depends_on: ["1.1"]
    note: "Dev hoàn thành 2026-11-15, chờ QA: lint/build đạt, 75 test đạt (8 tệp, Node 22.13.0). Đã xử lý V2 (engines) và V3 (test App không mock) của qa-1.1. V1 còn: mã 1.1 + 1.2 chưa commit đủ. Nhãn tiếng Việt và trường tìm kiếm là giả định của SM, cần PM xác nhận."
  "1.3":
    epic: "1"
    title: "Story 1.3"
    status: backlog
    sprint: 1
    order: 3
    depends_on: ["1.2"]
    note: "Làm sau 1.2. story-1.3.md còn là khung rỗng."
  "2.1":
    epic: "2"
    title: "Story 2.1"
    status: backlog
    sprint: 2
