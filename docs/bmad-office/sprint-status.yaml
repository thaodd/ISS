# sprint-status.yaml — Kế hoạch sprint cho ISS
# Người lập: Thiết Tướng (Scrum Master). Cập nhật: 2026-11-15.
#
# Trạng thái hợp lệ: backlog | ready | in-progress | review | done
#   backlog     : đã có story nhưng chưa đủ nội dung (thiếu mô tả / tiêu chí nghiệm thu) để Dev làm
#   ready       : story đã đủ ngữ cảnh, Dev có thể nhận
#   in-progress : Dev đang làm
#   review      : Dev xong, chờ QA / nghiệm thu
#   done        : QA đạt và đã nghiệm thu
#
# GHI CHÚ NGUỒN (đọc kỹ):
#   - docs/epics.md và docs/bmad-office/plan.json KHÔNG tồn tại. epics.md thật nằm ở
#     docs/bmad-office/epics.md và chỉ là khung rỗng (Epic 1 -> "Story 1.1: " trống);
#     không có plan.json nên danh sách epic/story lấy từ yeu-cau-001.md, lịch sử git và mã trong src/.
#   - product-brief, prd, architecture, story-*.md, qa-*.md hiện là khung mẫu "mô phỏng" (bản khung do
#     BMAD Office ghi đè lên bản thật). Bản story/QA thật vẫn còn trong lịch sử git, ví dụ
#     `git show b1e6b53:docs/bmad-office/qa-2.1.md`, `git show 8da929c:docs/bmad-office/story-2.2.md`.
#   - Trạng thái dưới đây suy ra từ commit thật: "test(story-x.y): QA PASS" => done;
#     "feat(story-x.y)" mà chưa có QA PASS => review; chưa có commit mã => backlog/ready.
#   - Tên epic / story suy ra từ yêu cầu #1 (docs/bmad-office/yeu-cau/yeu-cau-001.md) là GIẢ ĐỊNH,
#     cần PM (Tàng Thư Sinh) xác nhận khi hoàn thiện epics.md.
#   - Phạm vi Epic 2 do người dùng chốt ngày 2026-11-15: (1) "cài đặt ứng dụng" = GHI NHẬN
#     ứng dụng/phiên bản đã cài, KHÔNG cài thật, không backend; (2) 3 story 2.1-2.3; (3) bản ghi cài đặt
#     tham chiếu máy chủ theo server id (srv-NNN), không sửa schema Server của Epic 1.

project: "ISS"
generated: "2026-11-15"
current_sprint: 2
sprint_goal: "Hoàn thành Epic 2 (ghi nhận ứng dụng cài đặt trên máy chủ), story 2.1 đến 2.3, theo thứ tự."

sprints:
  - sprint: 1
    epic: "1"
    goal: "Hoàn thành Epic 1 (quản lý thông tin máy chủ), story 1.1-1.3, theo thứ tự 1.1 -> 1.2 -> 1.3."
    status: done
    result: "Đạt: 3/3 story done, QA PASS (commit test(story-1.1..1.3)). Còn nợ kỹ thuật ở mục blockers."
  - sprint: 2
    epic: "2"
    goal: "Hoàn thành Epic 2 (ghi nhận ứng dụng cài đặt trên máy chủ), story 2.1-2.3."
    status: in-progress
    result: "2.1 done; 2.2 review (Dev xong, chờ QA); 2.3 backlog."

# Cổng chuyển backlog -> ready: story-x.y.md phải có (1) mô tả "Là một… tôi muốn… để…",
# (2) tiêu chí nghiệm thu cụ thể, (3) ghi chú kỹ thuật bám architecture.md.
# Story 1.1-1.3, 2.1, 2.2 đã qua cổng này (khi soạn); 2.3 CHƯA qua nên còn backlog cho tới khi
# Scrum Master chạy Create Story 2.3.

epics:
  "1":
    title: "Quản lý thông tin máy chủ"   # giả định, theo yêu cầu #1
    status: done
    sprint: 1
    depends_on: []
    stories: ["1.1", "1.2", "1.3"]
    note: "Hoàn tất sprint 1 (3/3 story done, QA PASS). Nền tảng dữ liệu máy chủ; Epic 2 tham chiếu máy chủ theo id."
  "2":
    title: "Quản lý và ghi nhận cài đặt ứng dụng"   # tên theo yêu cầu #1; phạm vi do người dùng chốt 2026-11-15
    status: in-progress
    sprint: 2
    depends_on: ["1"]
    stories: ["2.1", "2.2", "2.3"]
    note: "Ghi nhận ứng dụng/phiên bản đã cài trên máy chủ, lưu localStorage như Epic 1 (không cài thật, không backend). Bản ghi cài đặt tham chiếu serverId. Epic 1 đã done nên Epic 2 không bị chặn."

# order: thứ tự thực hiện toàn cục (1 = làm đầu tiên).
# Chuỗi phụ thuộc: 1.1 -> 1.2 -> 1.3 ; 2.1 (độc lập dữ liệu, dùng khung 1.1) ; 2.2 cần 2.1 + 1.3 ; 2.3 cần 2.2.
stories:
  "1.1":
    epic: "1"
    title: "Khung dự án React và mô hình dữ liệu máy chủ"
    status: done
    sprint: 1
    order: 1
    depends_on: []
    note: "Story 1.1 được soạn lại đầy đủ ngày 2026-11-15 (docs/stories/1.1.story.md, bản sao docs/bmad-office/story-1.1.md; tài liệu ghi 'Ready', Dev Record/QA Results để trống) vì tệp cũ bị khung rỗng ghi đè. Mã + QA PASS đã có từ sprint 1 nên trạng thái ở đây GIỮ done (không hạ về ready để khỏi mở lại Epic 1/sprint 1); muốn Dev làm lại thì báo SM. Commit feat(story-1.1) + test(story-1.1): QA PASS. Nền cho mọi story sau: khung Vite/React/TS/Vitest và kiểu Server. Cần Node >= 20.19 (máy mặc định là Node 10). Tập trường Server, Vite/TS/Vitest là giả định của SM, cần PM/Architect xác nhận."
  "1.2":
    epic: "1"
    title: "Danh sách, tìm kiếm/lọc và xem chi tiết máy chủ"
    status: done
    sprint: 1
    order: 2
    depends_on: ["1.1"]
    note: "Commit feat(story-1.2) + test(story-1.2): QA PASS. Màn danh sách/chi tiết là nơi 2.2 hiển thị bản ghi cài đặt. Nhãn tiếng Việt và trường tìm kiếm là giả định của SM, cần PM xác nhận."
  "1.3":
    epic: "1"
